        <style>
            /* Lock screen in the spirit of Mexico City modernism — Barragán planes,
               raking light, hard shadows. */
            :root {
                --rosa: #0e7c86;
                --terracotta: #c2703d;
                --cobalt: #235789;
                --marigold: #f0b429;
                --cream: #f4f1e8;
                --stucco: #fbf8ef;
                --ink: #22281f;
                --sans: "Futura", "Avenir Next", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
            }

            .staticrypt-html {
                height: 100%;
                background: var(--cream);
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
                background: var(--cream);
                font-family: var(--sans);
                color: var(--ink);
                -webkit-font-smoothing: antialiased;
            }

            .staticrypt-content {
                position: relative;
                height: 100%;
                overflow: hidden;
                background: var(--cream);
            }

            /* architectural color planes — fixed so they always fill the real viewport */
            .plane {
                position: fixed;
                z-index: 0;
            }
            .plane-rosa {
                left: 0;
                top: 0;
                bottom: 0;
                width: 34vw;
                background: var(--rosa);
            }
            .plane-terracotta {
                left: 0;
                right: 0;
                bottom: 0;
                height: 18vh;
                background: var(--terracotta);
            }
            .plane-marigold {
                left: 34vw;
                top: 0;
                bottom: 18vh;
                width: 3.5vw;
                background: var(--marigold);
            }
            .plane-cobalt {
                right: 10vw;
                top: 12vh;
                width: 13vmin;
                height: 13vmin;
                background: var(--cobalt);
                box-shadow: 3vmin 3vmin 0 rgba(42, 33, 23, 0.25);
            }
            /* raking sunlight across everything */
            .plane-light {
                inset: 0;
                background: linear-gradient(115deg, rgba(255, 249, 235, 0.28) 0%, rgba(255, 249, 235, 0) 45%, rgba(42, 33, 23, 0.18) 100%);
                pointer-events: none;
                z-index: 2;
            }

            .staticrypt-page {
                position: relative;
                z-index: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 24px;
                box-sizing: border-box;
            }

            .staticrypt-form {
                background: var(--stucco);
                width: 100%;
                max-width: 400px;
                padding: 52px 44px 44px;
                box-sizing: border-box;
                text-align: left;
                box-shadow: 22px 22px 0 rgba(42, 33, 23, 0.3);
            }

            .staticrypt-instructions p.staticrypt-kicker {
                margin: 0 0 10px;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.42em;
                text-transform: uppercase;
                color: var(--terracotta);
            }

            .staticrypt-instructions p.staticrypt-title {
                margin: 0 0 6px;
                font-size: 34px;
                line-height: 1.05;
                font-weight: 700;
                letter-spacing: 0.02em;
                text-transform: uppercase;
            }

            .staticrypt-instructions p {
                margin: 0;
                font-size: 13px;
                color: rgba(42, 33, 23, 0.7);
            }

            .staticrypt-hr {
                margin: 26px 0;
                border: 0;
                border-top: 4px solid var(--marigold);
                width: 56px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font-family: var(--sans);
                font-size: 15px;
                letter-spacing: 0.06em;
                color: var(--ink);
                outline: 0;
                padding: 14px 44px 14px 2px;
                width: 100%;
            }
            .staticrypt-form input::placeholder {
                color: rgba(42, 33, 23, 0.4);
                text-transform: uppercase;
                font-size: 12px;
                letter-spacing: 0.2em;
            }

            .staticrypt-password-container {
                position: relative;
                width: 100%;
                margin: 0 0 20px;
                border-bottom: 3px solid var(--ink);
                box-sizing: border-box;
            }
            .staticrypt-password-container:focus-within {
                border-bottom-color: var(--cobalt);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                opacity: 55%;
                padding: 13px 2px 13px 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 24px;
                font-size: 12px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: rgba(42, 33, 23, 0.75);
            }

            .staticrypt-remember input[type="checkbox"] {
                appearance: none;
                -webkit-appearance: none;
                width: 18px;
                height: 18px;
                margin: 0 12px 0 0;
                border: 3px solid var(--ink);
                background: transparent;
                cursor: pointer;
                flex-shrink: 0;
            }
            .staticrypt-remember input[type="checkbox"]:checked {
                background: var(--cobalt);
                border-color: var(--cobalt);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                font-family: var(--sans);
                text-transform: uppercase;
                letter-spacing: 0.3em;
                font-size: 13px;
                font-weight: 700;
                outline: 0;
                background: var(--rosa);
                width: 100%;
                border: 0;
                padding: 17px 15px;
                color: var(--stucco);
                cursor: pointer;
                box-shadow: 8px 8px 0 var(--ink);
                transition: transform 80ms ease, box-shadow 80ms ease;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--cobalt);
            }
            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: translate(4px, 4px);
                box-shadow: 4px 4px 0 var(--ink);
            }

            .staticrypt-error {
                margin: 18px 0 0;
                padding: 12px 14px;
                background: var(--cobalt);
                color: var(--stucco);
                font-size: 12px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--rosa);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media (max-width: 640px) {
                .plane-rosa {
                    width: 100vw;
                    bottom: auto;
                    height: 26vh;
                }
                .plane-marigold {
                    left: 0;
                    top: 26vh;
                    bottom: auto;
                    width: 100vw;
                    height: 3vh;
                }
                .plane-cobalt {
                    right: 7vw;
                    top: 5vh;
                }
                .staticrypt-form {
                    padding: 40px 30px 34px;
                    box-shadow: 14px 14px 0 rgba(42, 33, 23, 0.3);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>
